name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regressions:
    name: Native regression tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched v2.4 source
        run: python3 tests/prepare-source.py build/regression-source

      - name: Configure
        run: >-
          cmake -S tests -B build/regression
          -DRR_SOURCE_DIR="$PWD/build/regression-source"
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRR_SANITIZERS=ON

      - name: Build tests
        run: cmake --build build/regression --parallel 2

      - name: Run tests
        run: ctest --test-dir build/regression --output-on-failure --output-junit results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            build/regression/translated-shaders/*.hlsl
            build/regression/results.xml
            build/regression/Testing/Temporary/LastTest.log
            build/regression/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  build:
    needs: regressions
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      # Full clone: Ring Racers' vcpkg.json pins a builtin-baseline commit
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('patches/ringracers-uwp.patch', 'build.ps1') }}
          restore-keys: vcpkg-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/download-artifact@v4
        with:
          name: regression-results
          path: regression-results

      - name: Compile translated add-on shader fixtures
        shell: pwsh
        run: |
          $fxc = (Get-Command fxc -ErrorAction Stop).Source
          $fixtures = @(Get-ChildItem regression-results -Recurse -Filter *.hlsl)
          if ($fixtures.Count -eq 0) { throw "No translated shader fixtures were produced" }
          foreach ($fixture in $fixtures) {
            $profile = if ($fixture.Name.EndsWith('.vert.hlsl')) { 'vs_4_0' } else { 'ps_4_0' }
            & $fxc /nologo /O3 /T $profile /E main /Fo "$env:TEMP/rr-shader-test.cso" $fixture.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      # Sign with a throwaway certificate matching the manifest's Publisher.
      # Install the .cer from the artifact before the package (Device Portal accepts both).
      - name: Package
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=danwo" `
            -KeyUsage DigitalSignature -FriendlyName "Ring Racers UWP CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath build\ci.pfx -Password $password | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null
          Export-Certificate -Cert $cert -FilePath out\ringracers-uwp.cer | Out-Null

          msbuild build\ringracers-uwp.vcxproj /p:Configuration=Release /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$PWD\build\ci.pfx" /p:PackageCertificatePassword=ci `
            /p:AppxPackageDir="$PWD\build\AppPackages\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem build\AppPackages -Recurse -Include *.msix, *.appx | Copy-Item -Destination out

          $package = @(Get-ChildItem out -Filter 'ringracers-uwp*.msix')
          if ($package.Count -ne 1) { throw "Expected one Ring Racers MSIX" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package[0].FullName)
          try {
            foreach ($notice in @('Licenses/glslang.txt', 'Licenses/SPIRV-Cross.txt')) {
              $entry = $archive.GetEntry($notice)
              if ($null -eq $entry -or $entry.Length -lt 1000) { throw "Package is missing $notice" }
            }
            if ($null -eq $archive.GetEntry('AppxSignature.p7x')) { throw "Package is unsigned" }
          } finally { $archive.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: ringracers-uwp
          path: out/

      # The linker map of this build, which maps the addresses in the game's profile (uwp-profile.txt) to functions
      - name: Collect symbols
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force symbols | Out-Null
          Get-ChildItem build -Recurse -Filter ringracers-uwp.map | Select-Object -First 1 | Copy-Item -Destination symbols

      - uses: actions/upload-artifact@v4
        with:
          name: ringracers-uwp-symbols
          path: symbols/
          if-no-files-found: error
