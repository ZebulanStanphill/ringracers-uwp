name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      # Full clone: Ring Racers' vcpkg.json pins a builtin-baseline commit
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('patches/ringracers-uwp.patch', 'build.ps1') }}
          restore-keys: vcpkg-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: pwsh
        run: ./build.ps1

      # Sign with a throwaway certificate matching the manifest's Publisher.
      # Install the .cer from the artifact before the package (Device Portal accepts both).
      - name: Package
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=danwo" `
            -KeyUsage DigitalSignature -FriendlyName "Ring Racers UWP CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath build\ci.pfx -Password $password | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null
          Export-Certificate -Cert $cert -FilePath out\ringracers-uwp.cer | Out-Null

          msbuild build\ringracers-uwp.vcxproj /p:Configuration=Release /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$PWD\build\ci.pfx" /p:PackageCertificatePassword=ci `
            /p:AppxPackageDir="$PWD\build\AppPackages\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem build\AppPackages -Recurse -Include *.msix, *.appx | Copy-Item -Destination out

      - uses: actions/upload-artifact@v4
        with:
          name: ringracers-uwp
          path: out/
