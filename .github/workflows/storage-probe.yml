name: Storage probe

on:
  push:
    branches: [storage-probe]
    paths:
      - 'tools/storage-probe/**'
      - '.github/workflows/storage-probe.yml'
  pull_request:
    paths:
      - 'tools/storage-probe/**'
      - '.github/workflows/storage-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up x64 MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw "Visual Studio C++ tools were not found" }
          $before = [Environment]::GetEnvironmentVariables('Process')
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe, fxc.exe, msbuild.exe -ErrorAction Stop | Select-Object Name, Source
          # Each step starts a new shell; preserve the developer environment.
          foreach ($entry in [Environment]::GetEnvironmentVariables('Process').GetEnumerator()) {
            if ($before[$entry.Key] -cne $entry.Value) {
              "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Build and sign the standalone probe
        shell: pwsh
        run: ./tools/storage-probe/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: storage-probe
          path: tools/storage-probe/out/
          if-no-files-found: error
